<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Stock Trading System - Portfolio</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="container">
    <div class="page-title" style="margin-top:32px;">My Portfolio</div>

    <div class="card pad">
      <table class="table" id="portfolioTable">
        <thead>
          <tr>
            <th>Stock Ticker</th>
            <th>Shares Owned</th>
            <th>Current Price</th>
            <th>Market Value</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card pad" style="margin-top:18px; display:flex; justify-content:space-between; align-items:center;">
      <div style="font-weight:600;">Total Portfolio Value</div>
      <div style="font-size:22px; font-weight:800;" id="totalValue">$0.00</div>
    </div>

    <div class="footer">© 2025 Stock Trading System. All rights reserved.</div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    STS.requireAuth(["CUSTOMER"]);
    STS.renderCustomerHeader("portfolio");
    STS.startPriceGenerator();

    const s0 = STS.loadState();
    const userId = s0.session.userId;

    const tbody = document.querySelector("#portfolioTable tbody");
    const totalEl = document.getElementById("totalValue");

    function render(){
      const s = STS.loadState();
      tbody.innerHTML = "";
      let total = 0;

      const positions = s.portfolioPositions.filter(
        p => p.userId === userId && Number(p.shares) > 0
      );

      positions.forEach(p => {
        const st = s.stocks.find(x => x.ticker === p.ticker);
        const price = st ? st.price : 0;
        const mv = Number((price * Number(p.shares)).toFixed(2));
        total += mv;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${p.ticker}</td>
          <td>${Number(p.shares).toLocaleString()}</td>
          <td>${STS.money(price)}</td>
          <td>${STS.money(mv)}</td>
        `;
        tbody.appendChild(tr);
      });

      totalEl.textContent = STS.money(total);
    }

    render();
    setInterval(render, 1500);

    // Immediate synchronization when Admin updates state
    window.addEventListener("sts-updated", render);
    window.addEventListener("storage", render);
  </script>
</body>
</html>
