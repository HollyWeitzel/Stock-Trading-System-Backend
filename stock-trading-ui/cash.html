<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cash Account</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="container">
    <div class="page-title" style="margin-top:28px;">Cash Account</div>

    <div class="card pad" style="max-width:720px;margin:0 auto;">
      <div class="muted" style="text-align:center;">Current Cash Balance</div>
      <div id="bal" style="text-align:center;font-size:36px;font-weight:900;margin-top:6px;">$0.00</div>
    </div>

    <div class="card pad" style="max-width:720px;margin:18px auto 0;">
      <div class="label">Deposit Amount</div>
      <input class="input" id="depAmt" placeholder="Enter amount to deposit" />
      <button class="btn" id="depBtn" style="width:100%;margin-top:12px;">Deposit</button>

      <hr class="sep"/>

      <div class="label">Withdraw Amount</div>
      <input class="input" id="wdAmt" placeholder="Enter amount to withdraw" />
      <button class="btn secondary" id="wdBtn" style="width:100%;margin-top:12px;">Withdraw</button>
    </div>

    <div class="card pad" style="max-width:720px;margin:18px auto 0;">
      <div style="font-weight:700;margin-bottom:8px;">Transaction Rules:</div>
      <ul style="margin:0 0 0 18px;">
        <li>Deposit amounts must be positive values</li>
        <li>Withdrawal amounts cannot exceed current balance</li>
        <li>All transactions are processed immediately</li>
      </ul>
      <div class="helper" id="msg" style="margin-top:10px;"></div>
    </div>

    <div class="footer">© 2025 Stock Trading System. All rights reserved.</div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    STS.requireAuth(["CUSTOMER"]);
    STS.renderCustomerHeader("cash");

    const s0 = STS.loadState();
    const userId = s0.session.userId;
    const bal = document.getElementById("bal");
    const msg = document.getElementById("msg");

    function refresh(){
      const s = STS.loadState();
      const acct = s.cashAccounts.find(a=>a.userId===userId);
      bal.textContent = STS.money(acct ? acct.balance : 0);
    }

    depBtn.onclick = () => {
      const res = STS.deposit(userId, depAmt.value);
      msg.textContent = res.msg;
      refresh();
    };

    wdBtn.onclick = () => {
      const res = STS.withdraw(userId, wdAmt.value);
      msg.textContent = res.msg;
      refresh();
    };

    refresh();

    // Immediate synchronization when state updates
    window.addEventListener("sts-updated", refresh);
    window.addEventListener("storage", refresh);
  </script>
</body>
</html>
